spring:
  application:
    name: kabal-innstillinger
  main:
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: flyway_history_schema,innstillinger
    clean-disabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      #       Size limitations are also handled by app itself to get nice fault messages, but this setting seems to fail faster?
      max-request-size: 8MB
      max-file-size: 8MB
  codec:
    max-in-memory-size: 16MB
  sql:
    init:
      platform: postgresql

server:
  port: 7081
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  health:
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - egenAnsatt
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

SERVICE_USER_USERNAME: srvklage-saksbeh

EGENANSATT_KAFKA_TOPIC: nom.skjermede-personer-v1

KLAGE_LOOKUP_APP_NAME: klage-lookup
KLAGE_LOOKUP_BASE_URL: http://klage-lookup